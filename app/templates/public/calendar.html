{% extends "layouts/app_base.html" %}

{% block page_title %}Calendar{% endblock %}

{% block extra_styles %}
  {{ super() }}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
{% endblock %}

{% block app_content %}
<div class="cal-toolbar d-flex align-items-center justify-content-between mb-2">
  <div class="d-flex align-items-center gap-2">
    <button type="button" class="btn btn-outline-secondary btn-sm" id="calPrev" title="Previous week">
      <span aria-hidden="true">&#x2039;</span>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="calToday">Today</button>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="calNext" title="Next week">
      <span aria-hidden="true">&#x203A;</span>
    </button>
  </div>
  <h5 class="cal-title mb-0" id="calTitle"></h5>
  <div class="text-end cal-toolbar-actions">
    <button type="button" class="btn btn-outline-secondary btn-sm" id="calSettingsBtn" title="Settings">
      <i class="bi bi-gear"></i>
    </button>
  </div>
</div>

<div id="calWeekContainer"></div>

<!-- Settings Modal -->
<div class="modal fade" id="calSettingsModal" tabindex="-1" aria-labelledby="calSettingsModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="calSettingsModalLabel">Calendar Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h6 class="mb-3">Appointment Statuses</h6>
        <div id="settingsStatusList"></div>
        <button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="settingsAddStatus">
          + Add Status
        </button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="settingsSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Appointment Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="appointmentModalLabel">New Appointment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="apptEventId" value="">

        <div class="mb-3 position-relative">
          <label class="form-label">Customer</label>
          <input type="hidden" id="apptCustomer" value="">
          <input type="text" class="form-control" id="apptCustomerSearch" placeholder="Search customer..." autocomplete="off">
          <div id="apptCustomerDrop" class="list-group position-absolute shadow-sm dd-scroll w-100" style="display:none;"></div>
        </div>

        <div class="mb-3 position-relative">
          <label class="form-label">Unit</label>
          <input type="hidden" id="apptUnit" value="">
          <input type="text" class="form-control" id="apptUnitSearch" placeholder="Search unit..." autocomplete="off" disabled>
          <div id="apptUnitDrop" class="list-group position-absolute shadow-sm dd-scroll w-100" style="display:none;"></div>
        </div>

        <div class="mb-3 position-relative">
          <label class="form-label">Service Presets</label>
          <div class="d-flex gap-2">
            <input type="text" class="form-control form-control-sm" id="apptPresetSearch" placeholder="Search preset..." autocomplete="off">
            <button type="button" class="btn btn-outline-secondary btn-sm flex-shrink-0" id="apptPresetAddBtn" disabled>+ Add</button>
          </div>
          <div id="apptPresetDrop" class="list-group position-absolute shadow-sm dd-scroll w-100" style="display:none;"></div>
          <input type="hidden" id="apptPresetPendingId" value="">
          <div id="apptPresetTags" class="d-flex flex-wrap gap-1 mt-2"></div>
        </div>

        <input type="hidden" id="apptDate" value="">

        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label">Start</label>
            <select class="form-select" id="apptStart"></select>
          </div>
          <div class="col-6">
            <label class="form-label">End</label>
            <select class="form-select" id="apptEnd"></select>
          </div>
        </div>

        <div class="mb-3 position-relative">
          <label class="form-label">Assign to Mechanic</label>
          <input type="hidden" id="apptMechanic" value="">
          <input type="text" class="form-control" id="apptMechanicSearch" placeholder="Search mechanic..." autocomplete="off">
          <div id="apptMechanicDrop" class="list-group position-absolute shadow-sm dd-scroll w-100" style="display:none;"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Status</label>
          <div id="apptStatusGroup" class="d-flex gap-2 flex-wrap"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Title / Note</label>
          <input type="text" class="form-control" id="apptTitle" placeholder="Optional">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-danger me-auto d-none" id="apptDeleteBtn">Delete</button>
        <button type="button" class="btn btn-outline-success d-none" id="apptCreateWOBtn">
          <i class="bi bi-file-earmark-plus me-1"></i>Create Work Order
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="apptSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/calendar/calendar.js') }}"></script>
{% endblock %}
