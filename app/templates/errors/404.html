<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Roobico</title>
    <script>
        /* Applies the saved app theme before first paint (falls back to system). */
        try {
            var t = localStorage.getItem("roobico.theme");
            if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        } catch (e) {}
    </script>
    <style>
        :root {
            --bg: #f1f5f2;
            --surface: #ffffff;
            --border: #d4ddd6;
            --text: #1a2e22;
            --muted: #5a7262;
            --accent: #16a34a;
            --shadow: 0 4px 24px rgba(0, 0, 0, .06);
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #212121;
            --surface: #2a2a2a;
            --border: #3a3a3a;
            --text: #ececec;
            --muted: #9b9b9b;
            --accent: #4ade80;
            --shadow: 0 12px 28px rgba(0, 0, 0, .55);
        }
        body {
            font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            padding: 48px 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 420px;
        }
        .brand {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .12em;
            color: var(--accent);
            margin-bottom: 12px;
        }
        h1 { font-size: 64px; margin: 0 0 8px; color: var(--accent); }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.55; }
        a.btn {
            display: inline-block;
            padding: 10px 24px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        a.btn:hover { filter: brightness(0.92); }
        html[data-theme="dark"] a.btn { color: #0b1220; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">ROOBICO</div>
        <h1>404</h1>
        <p>The page you are looking for doesn't exist or has been moved.</p>
        <a class="btn" href="/">Go home</a>
    </div>
</body>
</html>
